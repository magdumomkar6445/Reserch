
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tech_Titansss — Research Links</title>
<style>
:root{--bg:#f4f8fc;--card:#fff;--ink:#14213d;--mut:#5b6b85;--line:#dbe4ef;--pri:#2f5da8;--pri-ink:#fff;--chip:#e8f0fb;--danger:#c0392b;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1526;--card:#16213a;--ink:#e8eefb;--mut:#9fb0cc;--line:#26355a;--pri:#5b9bf0;--pri-ink:#0d1526;--chip:#1d2c4d;--danger:#ff7b6b}}
:root[data-theme="dark"]{--bg:#0d1526;--card:#16213a;--ink:#e8eefb;--mut:#9fb0cc;--line:#26355a;--pri:#5b9bf0;--pri-ink:#0d1526;--chip:#1d2c4d;--danger:#ff7b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.45}
.wrap{max-width:980px;margin:0 auto;padding:28px 18px 60px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:22px}
h1{margin:0;font-size:clamp(24px,5vw,34px);color:var(--pri)}
.sub{color:var(--mut);margin:4px 0 0;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
form .full{grid-column:1/-1}
label{display:block;font-size:12px;font-weight:bold;color:var(--mut);margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{resize:vertical;min-height:56px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px}
button.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);font-weight:bold}
button:hover{filter:brightness(1.06)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0 12px}
.bar input{flex:1;min-width:180px}
.bar select{width:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:var(--chip);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:13px;border:1px solid transparent}
.chip.on{background:var(--pri);color:var(--pri-ink)}
.list{display:grid;gap:12px}
.item{display:flex;gap:14px;justify-content:space-between;align-items:flex-start}
.item h3{margin:0 0 3px;font-size:17px}
.item a{color:var(--pri);word-break:break-all;font-size:13px}
.item p{margin:6px 0 0;font-size:14px}
.tag{display:inline-block;background:var(--chip);border-radius:6px;padding:2px 8px;font-size:12px;margin-right:6px;color:var(--mut)}
.acts{display:flex;gap:6px;flex-shrink:0}
.acts button{padding:6px 10px;font-size:13px}
.del{color:var(--danger)}
.empty{text-align:center;color:var(--mut);padding:34px 10px}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
#msg{color:var(--mut);font-size:13px;margin-top:8px;min-height:18px}
@media (max-width:600px){form{grid-template-columns:1fr}.item{flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Tech_Titansss — Research Links</h1>
      <p class="sub">POLAROPS · Integrated Polar Expedition Logistics &amp; Asset Management · SIH 2026</p>
    </div>
    <button id="theme" type="button">Toggle theme</button>
  </header>

  <div class="card">
    <form id="f">
      <div class="full"><label for="title">Title</label><input id="title" required maxlength="150" placeholder="e.g. Cold-chain RFID tags at sub-zero temperatures"></div>
      <div class="full"><label for="url">Link (URL)</label><input id="url" type="url" required placeholder="https://..."></div>
      <div><label for="cat">Topic</label><select id="cat"></select></div>
      <div><label for="src">Source type</label>
        <select id="src"><option>Research paper</option><option>Article</option><option>Documentation</option><option>Report / Gov</option><option>Video</option><option>GitHub / Code</option><option>Other</option></select></div>
      <div class="full"><label for="note">Why is it useful? (optional)</label><textarea id="note" maxlength="400" placeholder="Key takeaway for the project"></textarea></div>
      <div class="full"><button class="pri" id="save" type="submit">Add link</button> <button id="cancel" type="button" hidden>Cancel edit</button></div>
    </form>
  </div>

  <div class="bar">
    <input id="q" type="search" placeholder="Search title, note or URL">
    <select id="sort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="az">Title A–Z</option></select>
  </div>
  <div class="chips" id="chips"></div>
  <div class="list" id="list"></div>

  <div class="foot">
    <button id="exp" type="button">Export JSON</button>
    <button id="cp" type="button">Copy as text</button>
    <button id="imp" type="button">Import JSON</button>
    <input id="file" type="file" accept="application/json" hidden>
  </div>
  <div id="msg"></div>
  <p class="sub">Links are stored on the server (data/links.json), so everyone using this server sees the same list. Use Export to keep a backup.</p>
</div>

<script>
const CATS=["General","Offline-First Sync","Cold-Chain IoT Tags","AI Route & Risk Planner","Unified Command Dashboard","SOS Mesh Network","Polar Logistics","Hackathon / SIH"];
let links=[],filter="All",editId=null;
const $=id=>document.getElementById(id);
function say(t){$("msg").textContent=t;setTimeout(()=>{if($("msg").textContent===t)$("msg").textContent=""},4000)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function safe(u){try{const x=new URL(u);return(x.protocol==="http:"||x.protocol==="https:")?x.href:null}catch(e){return null}}
function fill(sel,arr){sel.innerHTML=arr.map(c=>`<option>${esc(c)}</option>`).join("")}
fill($("cat"),CATS);

async function call(method,url,data){
  const r=await fetch(url,{method,headers:{"Content-Type":"application/json"},body:data?JSON.stringify(data):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||"Request failed");
  return j;
}
async function load(quiet){
  try{links=await call("GET","/api/links");render()}
  catch(e){if(!quiet)say("Cannot reach the server: "+e.message)}
}

function render(){
  const counts={All:links.length};CATS.forEach(c=>counts[c]=links.filter(l=>l.cat===c).length);
  $("chips").innerHTML=["All",...CATS].map(c=>`<button type="button" class="chip${c===filter?" on":""}" data-c="${esc(c)}">${esc(c)} (${counts[c]||0})</button>`).join("");
  const q=$("q").value.trim().toLowerCase(),s=$("sort").value;
  let v=links.filter(l=>(filter==="All"||l.cat===filter)&&(!q||(l.title+" "+l.note+" "+l.url).toLowerCase().includes(q)));
  v.sort((a,b)=>s==="az"?a.title.localeCompare(b.title):s==="old"?a.t-b.t:b.t-a.t);
  $("list").innerHTML=v.length?v.map(l=>`<div class="card item"><div><h3>${esc(l.title)}</h3><a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.url)}</a><div style="margin-top:6px"><span class="tag">${esc(l.cat)}</span><span class="tag">${esc(l.src)}</span></div>${l.note?`<p>${esc(l.note)}</p>`:""}</div><div class="acts"><button type="button" data-e="${l.id}">Edit</button><button type="button" class="del" data-d="${l.id}">Delete</button></div></div>`).join(""):`<div class="card empty">${links.length?"No links match your search.":"No research links yet — add your first one above."}</div>`;
}
function resetForm(){editId=null;$("f").reset();$("save").textContent="Add link";$("cancel").hidden=true}

$("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const url=safe($("url").value.trim());if(!url){say("Please enter a valid http(s) link.");return}
  const d={title:$("title").value.trim(),url,cat:$("cat").value,src:$("src").value,note:$("note").value.trim()};
  try{
    if(editId){await call("PUT","/api/links/"+editId,d);say("Link updated.")}
    else{await call("POST","/api/links",d);say("Link added.")}
    resetForm();await load();
  }catch(err){say(err.message)}
});
$("cancel").onclick=resetForm;
$("chips").addEventListener("click",e=>{const c=e.target.closest("[data-c]");if(c){filter=c.dataset.c;render()}});
$("list").addEventListener("click",async e=>{
  const d=e.target.closest("[data-d]"),ed=e.target.closest("[data-e]");
  if(d&&confirm("Delete this link?")){try{await call("DELETE","/api/links/"+d.dataset.d);await load()}catch(err){say(err.message)}}
  if(ed){const l=links.find(x=>x.id===ed.dataset.e);if(!l)return;editId=l.id;$("title").value=l.title;$("url").value=l.url;$("cat").value=l.cat;$("src").value=l.src;$("note").value=l.note||"";$("save").textContent="Save changes";$("cancel").hidden=false;$("title").focus();window.scrollTo({top:0,behavior:"smooth"})}
});
$("q").oninput=render;$("sort").onchange=render;

$("exp").onclick=()=>{
  const b=new Blob([JSON.stringify(links,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="tech_titansss_research_links.json";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
$("cp").onclick=async()=>{
  const t=links.map((l,i)=>`${i+1}. ${l.title} [${l.cat}]\n   ${l.url}${l.note?"\n   "+l.note:""}`).join("\n");
  try{await navigator.clipboard.writeText(t||"No links yet");say("Copied to clipboard.")}catch(e){say("Copy is blocked — use Export JSON instead.")}
};
$("imp").onclick=()=>$("file").click();
$("file").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=async()=>{try{
    const a=JSON.parse(r.result);if(!Array.isArray(a))throw new Error("not an array");
    const res=await call("POST","/api/links/import",a);
    await load();say(res.added+" link(s) imported.");
  }catch(err){say("That file isn't a valid links export.")}};
  r.readAsText(f);e.target.value="";
};
$("theme").onclick=()=>{
  const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  r.dataset.theme=dark?"light":"dark";
};
load();
setInterval(()=>{if(!editId&&document.activeElement.tagName!=="INPUT"&&document.activeElement.tagName!=="TEXTAREA")load(true)},15000);
</script>
</body>
</html>
